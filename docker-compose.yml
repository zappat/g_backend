services:
  app:
    build:
      context: .
      args:
        - DEV=true
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - static_volume:/app/staticfiles
    depends_on:
      - db
      - redis
    env_file:
      - .env/dev.env

  db:
    image: postgres:13-alpine
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    env_file:
      - .env/dev.env
    ports:
      - "5432:5432"

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:latest
    volumes:
      - static_volume:/app/staticfiles  
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf  
      - ./dist:/usr/share/nginx/html
    ports:
      - "80:80"

volumes:
  dev-db-data:
  static_volume: